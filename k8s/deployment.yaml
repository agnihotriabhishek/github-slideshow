apiVersion: apps/v1
kind: Deployment
metadata:
  name: voxassist-backend
  labels:
    app: voxassist-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voxassist-backend
  template:
    metadata:
      labels:
        app: voxassist-backend
    spec:
      containers:
        - name: backend
          image: voxassist-backend:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: production
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: voxassist-secrets
                  key: jwt-secret
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Secret
metadata:
  name: voxassist-secrets
stringData:
  jwt-secret: dev-secret
