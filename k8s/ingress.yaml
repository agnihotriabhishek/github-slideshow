apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voxassist-backend
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: voxassist.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: voxassist-backend
                port:
                  number: 80
