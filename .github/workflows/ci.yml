name: ci

on:
  push:
    branches: [ main, master, develop, "feature/**", "release/**" ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Start server
        run: |
          nohup node dist/index.js >/tmp/server.log 2>&1 & echo $! > /tmp/server.pid
          for i in {1..30}; do curl -sf http://127.0.0.1:8080/healthz && break || sleep 0.5; done
      - name: Smoke test (WebSocket)
        env:
          BASE_URL: http://127.0.0.1:8080
        run: npm run -s smoke
      - name: Stop server
        if: always()
        run: |
          kill $(cat /tmp/server.pid) || true

  docker-build:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/voxassist-backend:latest
